# FF-030 CI baseline: real, non-deploying checks on every PR and develop push.
#
# Least-privilege: read-only contents, no secrets on untrusted PR jobs, no
# deployment, no Orca worker starts, no service restarts. Tests use fake
# adapters / disposable environments only.
#
# Action pins are full commit SHAs with their tag noted in the comment, so a
# tag move cannot silently change what CI runs.

name: ci-baseline

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: specs / contracts / hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Spec link check (docs integrity)
        run: python3 scripts/check-specs.py
      - name: SPEC-MANIFEST drift check
        run: python3 scripts/ci/check_manifest.py
      - name: Contract consistency (fixtures, dup schemas, $refs)
        run: python3 scripts/ci/check_contracts.py
      - name: v0.1 contract generator freeze check (E05)
        run: python3 packages/bridge-contracts/scripts/generate.py --check
      - name: Secret / credential hygiene
        run: python3 scripts/ci/check_hygiene.py
      - name: CODEOWNERS coverage (owner-gated review)
        run: |
          test -f .github/CODEOWNERS
          grep -Eq '^\* @Abraham12611([[:space:]]|$)' .github/CODEOWNERS
          echo "OK: all paths require @Abraham12611 review"
      - name: Fail-closed proof (canaries must fail the gates)
        run: python3 scripts/ci/inventory.py --prove-fail-closed

  suites:
    name: workstream suites + inventory report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.x"
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Runner tool versions
        run: node --version && python3 --version
      # FF-018 merge gate (PR #58, coordinator direction): its tsc typecheck
      # must be mandatory in CI alongside node --test (covered via NODE_ROOTS
      # discovery below). Pinned install only (npm ci + committed lockfile).
      - name: Merge-gate typecheck (integrations/github)
        run: |
          cd integrations/github && npm ci && npm run typecheck
      - name: Node node:test suites (present dirs only; absent dirs recorded uncovered)
        run: python3 scripts/ci/inventory.py --report ci-report.md
      # FF-023 security regression gate (PR #53, additive only): explicit
      # mandatory run of the policy engine plus its security suites. The
      # file list is explicit so deleting a security suite fails this step
      # instead of silently shrinking coverage. Does not alter any step above.
      - name: Policy security regression gate (FF-023)
        run: |
          cd packages/policy && node --test tests/policy.test.js tests/security-regression.test.js tests/audit-regression.test.js tests/boundary.test.js
      - name: Web Vite suite (only when apps/web exists)
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm ci && npm run build && npm test
          else
            echo "no apps/web/package.json: web node:test covered by inventory; Vite build uncovered (recorded in ci-report.md)"
          fi
      - name: Play readiness negative gate (placeholder must exit blocked)
        run: |
          rm -rf /tmp/play-bundle && mkdir -p /tmp/play-bundle
          cp apps/android/play-internal/fixtures/placeholder-manifest.json /tmp/play-bundle/manifest.json
          if python3 apps/android/play-internal/check_play_internal_readiness.py --bundle /tmp/play-bundle > /tmp/play-gate.json 2>&1; then
            echo "FAIL: placeholder bundle unexpectedly passed"; cat /tmp/play-gate.json; exit 1
          else
            code=$?
            test "$code" -eq 1 || { echo "FAIL: expected exit 1, got $code"; exit 1; }
            echo "OK: placeholder bundle blocked (exit 1) as designed"
          fi
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-report
          path: ci-report.md

  # FF-005 (PR #45, head-coordinator direction): the private-deploy
  # scaffold's fixture-only selftest must stay green. Non-deploying by
  # design: no secrets, no services, no VPS — disposable temp dirs only.
  # Additive: no existing job touched.
  deploy-selftest:
    name: deploy selftest (FF-005 scaffold, fixture-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Deploy scaffold selftest (non-deploying)
        run: bash scripts/deploy/selftest.sh

  # FF-031 additive gate: assembled bridge round trip on the fake backend.
  # Integration-owned paths only; #37/#35 are merged into develop, so this
  # job stays red only on the pending canonical #33 (policy) / #34 (adapter)
  # modules. All I/O is loopback + tmp dirs.
  bridge-integration:
    name: bridge round trip (FF-031, fake backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.x"
      - name: Bridge HTTP round trip + restart/no-duplicate (SQLite ledger)
        run: node --test services/orca-bridge/src/server.test.ts services/orca-bridge/src/runtime/scheduler-lease.test.ts
        env:
          FORGEFLEET_ALLOW_TEST_INGEST: "1"
      - name: Adapter finalization + cross-process proof
        run: node --test services/orca-bridge/test/*.test.js
        env:
          FORGEFLEET_ALLOW_TEST_INGEST: "1"
