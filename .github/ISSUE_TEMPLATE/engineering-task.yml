name: Engineering Task
description: Bounded implementation issue for a ForgeFleet engineer
title: '[FF] '
labels: []
body:
  - type: input
    id: owner
    attributes:
      label: Assigned engineer
      description: E01...E20
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / phase
      description: v0.1, v0.2, etc.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objective and user outcome
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Exclusive file ownership / allowed paths
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies and interface contracts
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests and evidence required
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, unknowns, rollback
  - type: checkboxes
    id: rules
    attributes:
      label: Working agreement
      options:
        - label: I will follow AGENTS.md, work in my own branch, open a PR, and never self-merge.
          required: true
