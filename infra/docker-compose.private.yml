# ForgeFleet private-phase stack (FF-005).
#
# Isolated alongside the existing Orca user service. This file never touches
# orca-serve.service: no shared network, no shared volume, no restart hook.
# All published ports bind 127.0.0.1 only. Public ingress stays disabled
# until the auth/realtime gates in docs/03-architecture/infra-deployment.md pass.
#
# Image tags and health paths are TBD until E01 pins the Paperclip release.
# Required variables fail closed (${VAR:?message}) instead of guessing.

name: forge-private

services:
  db:
    image: "${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the pinned PostgreSQL major version}"
    restart: unless-stopped
    env_file:
      - path: /etc/forgefleet/postgres.env
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - forge-internal
    # No ports: reachable only inside forge-internal.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:?}\" -d \"$${POSTGRES_DB:?}\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  paperclip:
    image: "${PAPERCLIP_IMAGE:?set PAPERCLIP_IMAGE to the pinned Paperclip release}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: /etc/forgefleet/paperclip.env
        required: true
    environment:
      PAPERCLIP_DEPLOYMENT_MODE: private
    ports:
      # Loopback only. Remote/private reach via Tailscale to the host.
      - "127.0.0.1:${PAPERCLIP_PORT:-8080}:8080"
    volumes:
      - context-store:/var/lib/forgefleet/context
    networks:
      - forge-internal
    healthcheck:
      # Path is a placeholder until E01 confirms the pinned build's endpoint.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080$${PAPERCLIP_HEALTH_PATH:-/healthz} | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  bridge:
    image: "${BRIDGE_IMAGE:?set BRIDGE_IMAGE to the pinned orca-bridge build}"
    restart: unless-stopped
    depends_on:
      paperclip:
        condition: service_started
    env_file:
      - path: /etc/forgefleet/bridge.env
        required: true
    environment:
      BRIDGE_BIND: "${BRIDGE_BIND:-127.0.0.1:8787}"
      # Kill switch: 1 pauses all new dispatch, leaves running workers alone.
      BRIDGE_NO_NEW_DISPATCH: "${BRIDGE_NO_NEW_DISPATCH:-0}"
    ports:
      # Loopback only. Never publish the bridge publicly.
      - "127.0.0.1:${BRIDGE_PORT:-8787}:8787"
    volumes:
      - bridge-state:/var/lib/forgefleet/bridge
    networks:
      - forge-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787$${BRIDGE_HEALTH_PATH:-/healthz} | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  forge-internal:
    internal: true

volumes:
  pgdata:
  context-store:
  bridge-state:
