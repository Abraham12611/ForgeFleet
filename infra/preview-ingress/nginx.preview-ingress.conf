# FF-028 staging API ingress (Vercel preview -> Vultr API). No secrets in this file.
# Implements infra/preview-ingress/ingress-policy.yaml. Bridge/Orca/DB are never routed here.

upstream paperclip_staging {
    # Loopback-adjacent staging backend; exact host is operator inventory, not a guess.
    server 127.0.0.1:8080;
}

upstream paperclip_auth_validator {
    server 127.0.0.1:8080;
}

limit_req_zone $binary_remote_addr zone=preview_ratelimit:10m rate=20r/s;

server {
    listen 443 ssl;
    # ssl_certificate / ssl_certificate_key are injected by the operator (never committed).

    server_name api.staging.example.invalid;

    # Upload ceiling shared by all locations; tightened per-endpoint below.
    client_max_body_size 10m;

    # --- CORS: Vercel previews + staging sibling only, never "*" ---
    # $http_origin is echoed only when it matches a preview/staging origin.
    set $cors_origin "";
    if ($http_origin ~* "^https://([a-z0-9-]+\.)?staging\.example\.invalid$") { set $cors_origin $http_origin; }
    if ($http_origin ~* "^https://[a-z0-9-]+\.vercel\.app$") { set $cors_origin $http_origin; }

    add_header Vary "Origin" always;

    # Preflight for the allowed split origins.
    location = /api/preflight {
        if ($request_method != 'OPTIONS') { return 405; }
        if ($cors_origin = "") { return 403; }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Last-Event-ID, Idempotency-Key" always;
        add_header Access-Control-Max-Age 600 always;
        return 204;
    }

    # --- Authenticated API (tasks/state) ---
    location /api/tasks {
        limit_req zone=preview_ratelimit burst=40 nodelay;
        auth_request /internal/auth/session;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        proxy_pass http://paperclip_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        limit_req zone=preview_ratelimit burst=40 nodelay;
        auth_request /internal/auth/session;
        proxy_pass http://paperclip_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSE event stream with reconnect support ---
    location = /api/events {
        limit_req zone=preview_ratelimit burst=40 nodelay;
        auth_request /internal/auth/session;
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        proxy_pass http://paperclip_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming essentials: no buffering, long-lived, resume via Last-Event-ID.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
        # Last-Event-ID passes straight to the backend for resume; state GET is fallback.
        proxy_set_header Last-Event-ID $http_last_event_id;
    }

    # --- Uploads: bounded size, authenticated, split-origin safe ---
    location = /api/uploads {
        limit_req zone=preview_ratelimit burst=20 nodelay;
        client_max_body_size 10m;
        limit_except POST PUT { deny all; }
        auth_request /internal/auth/session;
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
        proxy_pass http://paperclip_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_send_timeout 5m;
        proxy_read_timeout 5m;
    }

    # --- Session validator (private to this ingress, not a public route) ---
    location = /internal/auth/session {
        internal;
        proxy_pass http://paperclip_auth_validator;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Explicit denials: bridge/Orca/private are never public ---
    location ~ ^/(bridge|internal(?!/auth/session)|metrics-private|orca)(/|$) {
        deny all;
        return 404;
    }

    # Default deny: only the declared public API surface exists on this ingress.
    location / {
        return 404;
    }
}
